name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            arch: arm64
            suffix: apple-silicon
            expect: arm64
          - label: Universal
            arch: universal
            suffix: universal
            expect: x86_64 arm64
    steps:
      - uses: actions/checkout@v4

      - name: Show tools
        run: |
          xcodebuild -version
          swift --version

      - name: Set version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Run protocol and safety checks
        run: swift run DL24CoreChecks

      - name: Build app
        run: ./build_app.sh ${{ matrix.arch }}

      - name: Confirm architectures
        run: |
          actual="$(lipo -archs "build/DL24 Control.app/Contents/MacOS/DL24Control")"
          echo "Built for: $actual"
          for want in ${{ matrix.expect }}; do
            [[ " $actual " == *" $want "* ]] || { echo "Missing $want"; exit 1; }
          done
          codesign --verify --verbose "build/DL24 Control.app"

      - name: Package disk image
        run: |
          name="DL24-Control-$VERSION-${{ matrix.suffix }}.dmg"
          ./make_dmg.sh "$name"
          shasum -a 256 "$name" > "$name.sha256"
          echo "DMG_NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: DL24-Control-${{ matrix.suffix }}
          path: |
            ${{ env.DMG_NAME }}
            ${{ env.DMG_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
